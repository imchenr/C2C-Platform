<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/Users/eddy/Codes/design-platform/thesis-analysis/fonts</dir>
  <cachedir>/Users/eddy/Codes/design-platform/thesis-analysis/font-cache</cachedir>

  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Arial Unicode MS</string></edit>
  </match>
</fontconfig>
